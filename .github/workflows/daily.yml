name: Daily job collection

on:
  schedule:
    # 03:15 UTC every day
    - cron: '15 3 * * *'
  # lets you start a run by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # the first run reads 30 days of jobs and takes longest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Collect new postings
        run: node scraper/run.js

      - name: Build the website's data
        run: node scraper/buildSiteData.js

      - name: Save to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site-data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -m "Job data for $(date -u +%F)"
          git pull --rebase
          git push
